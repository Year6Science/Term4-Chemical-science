<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 6 Science | Part A · Change Detectives</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#10233d;background:#eaf1f9}*{box-sizing:border-box}body{margin:0}header{background:#0e2445;color:white;padding:16px max(20px,calc((100vw - 1060px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font-size:15px}header span{font-size:12px;color:#c4d6f1}.shell{max-width:1060px;margin:25px auto;padding:0 18px}.progress{height:9px;border-radius:30px;background:#cbd8e9;overflow:hidden}.bar{height:100%;background:#21a68c;transition:width .25s}.count{margin:10px 0 18px;color:#41546e;font-size:14px}.panel{background:white;border-radius:22px;box-shadow:0 10px 35px #1b34551a;padding:clamp(22px,5vw,46px);min-height:470px}.eyebrow{color:#176f93;font-size:12px;font-weight:850;letter-spacing:1.3px;text-transform:uppercase}.title{font-size:clamp(29px,4.8vw,43px);line-height:1.13;margin:12px 0}.subtitle{font-size:19px;color:#49607c;margin:0 0 22px}.body{font-size:18px;line-height:1.7}.visual{background:#eaf5fa;border:2px solid #c5e4ee;border-radius:16px;padding:19px;margin:23px 0;font-size:20px;font-weight:700}.points{padding-left:25px;line-height:1.65;font-size:17px}.points li{margin:9px 0}.note{background:#fff4d7;border-left:5px solid #e7a92d;padding:15px 18px;border-radius:8px;margin:20px 0;line-height:1.5}.q{font-size:20px;font-weight:750;margin:20px 0}.options{display:grid;gap:12px}.option{background:#f3f7fc;border:2px solid #d8e2ef;border-radius:13px;padding:16px;text-align:left;font:inherit;font-size:17px;color:#162d4a;cursor:pointer}.option:hover,.option.selected{border-color:#2078c5;background:#e6f2ff}.option:disabled{cursor:default}.feedback{margin-top:16px;padding:17px;border-radius:12px;line-height:1.6;font-size:16px}.feedback.good{background:#dcf5e8;border:1px solid #65bb90}.feedback.try{background:#fff2d5;border:1px solid #e9bb59}.btn{border:0;border-radius:12px;padding:13px 22px;font-weight:750;font-size:16px;cursor:pointer;background:#176fc1;color:white}.btn.secondary{background:#e1eaf4;color:#143a65}.btn:disabled{opacity:.45;cursor:not-allowed}.controls{display:flex;justify-content:space-between;gap:12px;margin:20px 0 35px}.steps{display:grid;gap:10px}.step{padding:13px 17px;background:#f0f5fb;border-radius:10px;font-size:17px}.prompt{font-weight:750;font-size:19px;margin:20px 0}.help{background:#e9f5fc;padding:16px;border-radius:12px;line-height:1.65;margin:14px 0;color:#183f63}.writing{width:100%;min-height:135px;border:2px solid #8eabc9;background:#fff;color:#142b46;border-radius:13px;font:inherit;font-size:17px;line-height:1.6;padding:15px;resize:vertical}.writing:focus{outline:3px solid #b9dffd}.small{color:#50647e;font-size:14px}.sortgrid{display:grid;gap:14px}.sortrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:15px;background:#f2f6fb;border-radius:12px}.sortrow strong{font-size:16px}.sortrow select{border:2px solid #a9bdd4;border-radius:9px;padding:10px;background:white;color:#10233d;font-size:15px;max-width:100%}@media(max-width:600px){.sortrow{grid-template-columns:1fr}.controls{flex-wrap:wrap}header{padding:13px 18px}.panel{min-height:unset}}@media print{header,.controls,.progress,.count{display:none}.panel{box-shadow:none}}
</style></head><body><header><b>🔬 YEAR 6 SCIENCE LAB</b><span>PART A · CHANGE DETECTIVES · OFFLINE READY</span></header><main class="shell"><div class="progress" aria-label="Lesson progress"><div id="bar" class="bar"></div></div><div id="count" class="count"></div><section id="panel" class="panel" aria-live="polite"></section><nav class="controls"><button id="back" class="btn secondary">← Back</button><button id="next" class="btn">Next →</button></nav></main><script>
const slides=[{"kind":"intro","tag":"MISSION BRIEF","title":"Part A · Change Detectives","subtitle":"Learn it. See it. Try it. Check it.","body":"You will learn to compare materials before and after a change, recognise reversible and irreversible changes, and explain your scientific thinking. All practice examples are different from your assessment.","steps":["1 · Original and changed materials","2 · Similarities and differences","3 · Compare two new changes","4 · Classify six changes","5 · Explain your reasoning"]},{"kind":"teach","tag":"SKILL 1 · LEARN","title":"What changes — and what stays?","subtitle":"Compare the material before and after a change.","body":"The <b>original material</b> is what we started with. The <b>changed material</b> is what we have afterwards. Scientists describe what they can observe: shape, size, colour, texture, state and whether a new substance may have formed.","example":"🧊 Ice cube → 💧 Liquid water","points":["Before: solid ice, cold, holds its shape.","After: liquid water, flows and takes the shape of its container.","Same: both are water. The state changed, but no new substance formed."],"note":"A change in appearance does not always mean a new substance has formed."},{"kind":"quiz","tag":"SKILL 1 · PRACTISE","title":"Compare before and after","subtitle":"A chocolate button is warmed until it melts.","question":"Which statement best compares the original and changed chocolate?","options":["It changed from solid to liquid but is still chocolate.","It changed into water because it became a liquid.","A new substance must have formed because it looks different."],"correct":0,"feedback":"The state and shape changed, but it is still chocolate. Melting is a physical change.","wrong":"Look for what actually changed and what material remained the same."},{"kind":"teach","tag":"SKILL 1 · WORKED EXAMPLE","title":"Describe the original and changed material","subtitle":"Use observable properties to compare before and after.","body":"When you are asked to compare the <b>original material</b> and the <b>changed material</b>, describe <b>both</b>. Look for changes in state, colour, shape, texture and what stays the same. Do not just write “it changed”.","example":"🧈 Cold butter → melted butter","points":["Original: yellow, solid butter that holds its shape.","Changed: yellow, liquid butter that flows.","Same: it is still butter; the colour and material remain the same.","Different: the state and ability to hold its shape have changed."],"note":"Useful structure: “Originally, the material was ___. After the change, it was ___. Both ___. However, ___.”"},{"kind":"quiz","tag":"SKILL 1 · CHECK","title":"Compare original and changed materials","subtitle":"A rubber band is stretched and then released.","question":"Which response best describes the original and changed material?","options":["The rubber band becomes a new substance when stretched.","Originally it was shorter; when stretched it became longer and thinner, but it remained rubber.","It is different because it changed."],"correct":1,"feedback":"This describes an observable difference AND what stays the same.","wrong":"A strong comparison describes before and after and names what stays the same."},{"kind":"teach","tag":"SKILL 2 · LEARN","title":"Similarities and differences","subtitle":"Compare TWO changes, not just two objects.","body":"A <b>similarity</b> is something both changes have in common. A <b>difference</b> is something that happens in one change but not the other. Compare the <em>process</em> and what happens to the materials.","example":"🎈 Inflating a balloon  VS  🍞 Toasting bread","points":["Similarity: both materials look different afterwards.","Difference: a balloon can be deflated and returned close to its original shape; toasted bread cannot be changed back into untoasted bread.","Important: name both changes in your comparison."],"note":"Useful words: both, whereas, however, unlike, because."},{"kind":"quiz","tag":"SKILL 2 · PRACTISE","title":"Find the similarity","subtitle":"Compare inflating a balloon and toasting bread.","question":"Which is a similarity between the two changes?","options":["Both changes can be reversed completely.","Both materials have a different appearance afterwards.","Both changes produce the same new substance."],"correct":1,"feedback":"Both look different after the change, even though the kinds of changes are not the same.","wrong":"A similarity must be true for BOTH changes."},{"kind":"quiz","tag":"SKILL 2 · PRACTISE","title":"Find the difference","subtitle":"Keep comparing the same two changes.","question":"Which statement explains a difference?","options":["Both changes happen to materials.","The balloon can be deflated, whereas toasted bread cannot become untoasted bread again.","Both changes are interesting to watch."],"correct":1,"feedback":"This identifies a difference and explains it using both changes.","wrong":"A difference should contrast what happens in one change with the other."},{"kind":"teach","tag":"SKILL 3 · LEARN","title":"Compare a new pair","subtitle":"Use the same comparison method with unfamiliar examples.","body":"You may be asked to choose <b>two other changes</b> and compare them. First describe each change, then find one similarity and one difference. Avoid saying only “they are different”. Explain <b>how</b>.","example":"🕯️ Wax melts and cools  VS  🥚 An egg is cooked","points":["Wax: warming melts solid wax; cooling makes it solid again.","Egg: heating changes the raw egg into a cooked egg; cooling does not make it raw again.","Similarity: heating changes both materials.","Difference: the wax can solidify again, but the cooked egg cannot return to its raw state."],"note":"Worked answer: “Both changes involve heating. However, the wax can return to a solid when cooled, whereas the cooked egg cannot become raw again.”"},{"kind":"teach","tag":"SKILL 3 · BEFORE YOU TRY","title":"What happens when a puddle dries?","subtitle":"Understand evaporation and browning before comparing.","body":"<b>Evaporation</b> happens when liquid water changes into an invisible gas called <b>water vapour</b>. The water has not disappeared — it has moved into the air. Evaporation can happen without boiling.<br><br>When a <b>cut apple turns brown</b>, substances in the apple react with oxygen in the air. This is called <b>browning</b>. It is not water changing state.","example":"☀️ Puddle: liquid water → water vapour   |   🍎 Cut apple: pale surface → brown surface","points":["Similarity: both changes can happen when materials are exposed to air.","Difference: the puddle loses liquid water through evaporation, whereas the apple changes colour through a reaction.","Evaporation is a change of state. Browning is a different kind of change."],"note":"Think about WHAT changes in each example before writing."},{"kind":"quiz","tag":"SKILL 3 · QUICK CHECK","title":"Check your understanding","subtitle":"Make sure you understand evaporation first.","question":"A puddle becomes smaller on a warm day. What happened to most of the missing water?","options":["It was destroyed by sunlight.","It changed into water vapour and moved into the air.","It turned into a new solid substance."],"correct":1,"feedback":"Correct. Evaporation changes liquid water into water vapour in the air.","wrong":"Water is not destroyed. Think about a change from liquid to gas."},{"kind":"write","tag":"SKILL 3 · YOUR TURN","title":"Write one comparison","subtitle":"Compare a puddle drying and an apple turning brown.","prompt":"Write ONE similarity and ONE difference between the changes.","help":"Both changes ______. However, the puddle ______, whereas the apple ______.","model":"Both changes make the materials look different. However, the puddle dries because liquid water evaporates into water vapour, whereas the cut apple turns brown through a chemical change.","tip":"Think: what happens to the water? What happens to the cut apple?"},{"kind":"teach","tag":"SKILL 3 · CHOOSE YOUR PAIR","title":"Choose two changes to compare","subtitle":"In the assessment you must select two examples yourself.","body":"You will see a set of changes. <b>Choose two</b> that you understand. Describe what happens in each one, then write <b>one similarity</b> and <b>one difference</b>. You can compare what changes, whether the original material can be recovered, or whether heating or cooling is involved.","example":"YOUR PRACTICE CHOICES: 🎈 Inflating a balloon · 🧈 Melting butter · 🍞 Toasting bread · ✂️ Cutting paper","points":["Choose two changes from the list (not from the assessment).","Similarity starter: “Both changes ___.”","Difference starter: “However, ___, whereas ___.”","Check: Have you named BOTH changes and explained how they are alike and different?"],"note":"A comparison needs two named changes and a reason, not just two labels."},{"kind":"write","tag":"SKILL 3 · YOUR TURN","title":"Choose and compare two changes","subtitle":"Pick any TWO of the four changes from the previous slide.","prompt":"Name your two changes. Write one similarity and one difference between them.","help":"I chose ______ and ______. Both changes ______. However, ______, whereas ______.","model":"I chose melting butter and toasting bread. Both changes can involve heating. However, melted butter can become solid again when cooled, whereas toasted bread cannot return to untoasted bread.","tip":"Choose two you understand. Your answer may be different from the model."},{"kind":"teach","tag":"SKILL 4 · LEARN","title":"Reversible or irreversible?","subtitle":"Classify changes using evidence.","body":"A <b>reversible change</b> can be undone so the original material is recovered or returned to its earlier condition. An <b>irreversible change</b> cannot readily be undone to recover the original material. Some irreversible changes produce new substances.","example":"🔄 Reversible: water freezes ⇄ ice melts   |   ➡️ Irreversible: an egg cooks","points":["Ask: Can the original material be recovered by a realistic process?","Do not decide from appearance alone. A change in colour or shape is a clue to investigate, not automatic proof.","Explain the reason, not just the label."],"note":"For this activity, classify each example by whether the original material can be restored."},{"kind":"sort","tag":"SKILL 4 · PRACTISE","title":"Classify six changes","subtitle":"Choose reversible or irreversible for every example.","items":[["Water freezes into ice","Reversible","The ice can melt back into liquid water."],["A raw egg is cooked","Irreversible","Cooling cannot turn the cooked egg back into a raw egg."],["A balloon is inflated and deflated","Reversible","The air can be released and the balloon returns close to its original shape."],["Bread is toasted","Irreversible","The toast cannot be changed back into untoasted bread."],["Chocolate melts and sets again","Reversible","Cooling can turn melted chocolate solid again."],["A cut apple turns brown","Irreversible","The browning reaction is not simply undone to restore the freshly cut apple."]]},{"kind":"teach","tag":"SKILL 5 · LEARN","title":"Explain your scientific reasoning","subtitle":"How are reversible and irreversible changes alike and different?","body":"Your explanation needs <b>three parts</b>: (1) say what both kinds of changes have in common, (2) explain the important difference, and (3) support it with an example of each.","example":"MODEL · A clear Year 6 answer","points":["Similarity: Both reversible and irreversible changes affect how materials look or behave.","Difference: Reversible changes can be undone to recover the original material; irreversible changes cannot readily be undone.","Examples: Ice melting is reversible because water can freeze again. Cooking an egg is irreversible because the cooked egg cannot become raw again."],"note":"Use the scientific words reversible, irreversible, original material, change and because."},{"kind":"quiz","tag":"SKILL 5 · CHECK","title":"Choose the strongest explanation","subtitle":"Look for a similarity, a difference and evidence.","question":"Which answer explains both kinds of change best?","options":["Reversible changes are good and irreversible changes are bad.","Both change materials. Melting ice is reversible because it can freeze again, while cooking an egg is irreversible because it cannot return to raw egg.","Reversible changes happen quickly and irreversible changes take longer."],"correct":1,"feedback":"This gives a similarity, a difference, and a reason supported by examples.","wrong":"The strongest answer explains what both have in common, how they differ, and why."},{"kind":"write","tag":"SKILL 5 · YOUR TURN","title":"Build your own explanation","subtitle":"Use different examples from the model.","prompt":"Explain how reversible and irreversible changes are similar and different. Include an example of each.","help":"Both reversible and irreversible changes ______. A reversible change ______, for example ______ because ______. An irreversible change ______, for example ______ because ______.","model":"Both reversible and irreversible changes affect materials. A reversible change can be undone, such as melting chocolate, because it can become solid again when cooled. An irreversible change cannot readily be undone, such as toasting bread, because the toast cannot return to untoasted bread.","tip":"Try chocolate melting and bread toasting, or choose your own examples."},{"kind":"end","tag":"MISSION COMPLETE","title":"Ready for Part A?","subtitle":"You have practised every type of question.","body":"You can now describe original and changed materials, compare similarities and differences, classify changes and explain your answers with scientific evidence.","steps":["I can describe what changed and what stayed the same.","I can compare two changes using both and whereas.","I can classify changes as reversible or irreversible.","I can explain why using examples."]}];
let current=0;const answers={};
const $=id=>document.getElementById(id);
function escapeHTML(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const s=slides[current];$('bar').style.width=((current+1)/slides.length*100)+'%';$('count').textContent=`Slide ${current+1} of ${slides.length}`;let h=`<div class="eyebrow">${s.tag}</div><h1 class="title">${s.title}</h1><p class="subtitle">${s.subtitle||''}</p>`;
if(s.body)h+=`<div class="body">${s.body}</div>`;
if(s.example)h+=`<div class="visual">${s.example}</div>`;
if(s.points)h+=`<ul class="points">${s.points.map(x=>`<li>${x}</li>`).join('')}</ul>`;
if(s.note)h+=`<div class="note">💡 ${s.note}</div>`;
if(s.steps)h+=`<div class="steps">${s.steps.map(x=>`<div class="step">${x}</div>`).join('')}</div>`;
if(s.kind==='quiz'){h+=`<div class="q">${s.question}</div><div class="options">${s.options.map((o,i)=>`<button class="option ${answers[current]?.choice===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div id="feedback"></div>`;}
if(s.kind==='write'){h+=`<div class="prompt">${s.prompt}</div><div class="help"><b>Sentence starter:</b> ${s.help}</div><p class="small">${s.tip}</p><textarea id="writing" class="writing" placeholder="Type your own answer here...">${escapeHTML(answers[current]?.text||'')}</textarea><div style="margin-top:14px"><button class="btn secondary" onclick="showModel()">Show model answer</button></div><div id="feedback"></div>`;}
if(s.kind==='sort'){h+=`<p class="body">For each change, choose the best classification. Then check your answers.</p><div class="sortgrid">${s.items.map((x,i)=>`<div class="sortrow"><strong>${i+1}. ${x[0]}</strong><select aria-label="Classification for ${escapeHTML(x[0])}" onchange="setSort(${i},this.value)"><option value="">Choose...</option><option value="Reversible" ${answers[current]?.sort?.[i]==='Reversible'?'selected':''}>Reversible</option><option value="Irreversible" ${answers[current]?.sort?.[i]==='Irreversible'?'selected':''}>Irreversible</option></select></div>`).join('')}</div><div style="margin-top:18px"><button class="btn" onclick="checkSort()">Check all six</button></div><div id="feedback"></div>`;}
$('panel').innerHTML=h;$('back').disabled=current===0;$('next').textContent=current===slides.length-1?'Start again':'Next →';
if(s.kind==='quiz'&&answers[current]?.choice!==undefined)showQuizFeedback();if(s.kind==='write'&&answers[current]?.reveal)showModel(false);if(s.kind==='sort'&&answers[current]?.checked)checkSort(false);
}
function choose(i){answers[current]={choice:i};render();}
function showQuizFeedback(){let s=slides[current],good=answers[current].choice===s.correct;$('feedback').innerHTML=`<div class="feedback ${good?'good':'try'}"><b>${good?'✓ Correct!':'↻ Try again.'}</b> ${good?s.feedback:s.wrong}</div>`;}
function showModel(save=true){if(save){answers[current]=answers[current]||{};answers[current].text=$('writing').value;answers[current].reveal=true;}const s=slides[current];$('feedback').innerHTML=`<div class="feedback good"><b>Example response (compare with your own):</b><div style="margin-top:8px">${s.model}</div></div>`;}
function setSort(i,val){answers[current]=answers[current]||{};answers[current].sort=answers[current].sort||{};answers[current].sort[i]=val;answers[current].checked=false;$('feedback').innerHTML='';}
function checkSort(save=true){let s=slides[current],a=answers[current]||{};if(save){a.checked=true;answers[current]=a;}let correct=0;let lines=s.items.map((x,i)=>{let ok=a.sort?.[i]===x[1];if(ok)correct++;return `<div style="margin:8px 0"><b>${ok?'✓':'○'} ${x[0]}:</b> ${x[1]}. ${x[2]}</div>`;});$('feedback').innerHTML=`<div class="feedback ${correct===s.items.length?'good':'try'}"><b>${correct} of ${s.items.length} correct.</b>${lines.join('')}</div>`;}
function move(d){let w=$('writing');if(w){answers[current]=answers[current]||{};answers[current].text=w.value;}current+=d;if(current>=slides.length)current=0;if(current<0)current=0;render();window.scrollTo({top:0,behavior:'instant'});}
$('back').onclick=()=>move(-1);$('next').onclick=()=>move(1);render();
</script></body></html>
