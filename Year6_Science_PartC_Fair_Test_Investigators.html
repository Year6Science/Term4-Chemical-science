 same mass of drink powder to dissolve at three water temperatures. What conclusion does the graph support? Give two measurements as evidence and explain one way the class could keep the test fair.", "type": "write", "starter": "The graph shows…\nFor example, at …°C it took … seconds, but at …°C it took … seconds.\nThe test was fair because…", "model": "As the water temperature increased, the drink powder dissolved more quickly. At 15°C it took 80 seconds, while at 45°C it took only 27 seconds. The class could keep the test fair by using the same mass of powder and volume of water in each trial, changing only the water temperature.", "chart": true}, {"title": "Improve an investigation", "icon": "🛠️", "learn": "A useful improvement fixes a specific weakness. You could measure more accurately, control a variable, repeat trials or use consistent timing. Explain <b>how</b> the change would make the results more trustworthy.", "tip": "Ask: “What could cause an unfair comparison or an inaccurate measurement?”", "question": "A student compares dissolving times but uses “one big spoonful” of powder each time. Which improvement is most useful?", "type": "choice", "options": ["Measure the same mass of powder on a balance for each trial.", "Use a bigger spoon each time.", "Stop recording the time."], "correct": 0, "feedback": "Measuring an equal mass with a balance controls the amount of powder. Repeating the test could also help check reliability."}, {"title": "Compare data and ask two questions", "icon": "❓", "learn": "Scientists collect information by <b>describing what they notice</b> or <b>measuring with numbers and units</b>. Compare what each group recorded. Then ask two questions that could be tested in another investigation.", "tip": "A good question changes one factor and measures one result. Try “How does … affect …?” Write TWO different questions.", "question": "Compare the two groups’ results. What is one difference between their data? Then write TWO testable questions for a further dissolving investigation.", "type": "write", "starter": "One difference is…\nQuestion 1: How does … affect …?\nQuestion 2: How does … affect …?", "model": "Group Yellow used descriptions, while Group Green measured dissolving time in seconds. Question 1: How does stirring speed affect the time for drink powder to dissolve? Question 2: How does the amount of water affect dissolving time if the powder mass stays the same?"}, {"title": "Evaluate a claim", "icon": "🧊", "learn": "A <b>claim</b> is an idea someone says is true. To evaluate it, check whether the evidence supports it. First decide if the claim is correct, then explain the science and choose evidence that could test it.", "tip": "Melting changes ice from solid water to liquid water. Freezing can change it back.", "question": "A student says: “When an ice cube melts, the liquid is a completely new substance.” Use the evidence to decide whether this claim is correct.", "type": "claimquiz", "starter": "", "model": "The claim is incorrect. Ice and liquid water are the same substance in different states. Cooling the water in a freezer can turn it back into ice, showing that melting is reversible."}];

 if(page<=-1){$('count').textContent=page===-3?'Introduction 1 of 3 · Fair Testing':page===-2?'Introduction 2 of 3 · COWS':'Introduction 3 of 3 · Evaluating fair tests';$('card').innerHTML=page===-3?`<div class="small">PART C · INTRODUCTION</div><h1>🔬 Fair Testing</h1><section class="learn"><h2>What is fair testing?</h2><p>A <b>fair test</b> is a scientific investigation where we <b>change one thing</b>, <b>observe or measure the result</b>, and <b>keep other important conditions the same</b>.</p></section><section class="learn"><h2>Why do we use fair testing?</h2><p>We use fair testing to make sure our results are <b>trustworthy</b>. When only one thing changes, we can work out what caused a difference in the results.</p></section><div class="mini"><strong>🌱 Example: Does sunlight affect plant growth?</strong><p>If one plant gets more sunlight, but both plants receive the same amount of water and grow in the same type of soil, we can compare their growth more fairly.</p><p>If we also change the water and soil, we won't know which change caused the difference.</p></div><p><b>Next:</b> Learn the COWS reminder to help you plan and check a fair test.</p><div class="controls"><span></span><button class="mainbtn" onclick="next()">Next: Remember COWS →</button></div>`:page===-2?`<div class="small">PART C · SCIENCE SKILLS</div><h1>🐄 Remember COWS!</h1><p>A <b>fair test</b> changes <b>one thing</b>, observes or measures what happens, and keeps other important conditions the same. This helps us trust the results.</p><div class="cowgrid"><div class="cow"><b>C</b><strong>Change</strong><p>Change ONE thing (independent variable).</p></div><div class="cow"><b>O</b><strong>Observe</strong><p>Observe or measure what happens (dependent variable).</p></div><div class="cow"><b>W</b><strong>What</strong><p>What other conditions must stay the same?</p></div><div class="cow"><b>S</b><strong>Same</strong><p>Keep those conditions the SAME (controlled variables).</p></div></div><div class="mini"><strong>🧻 Example: Which paper towel absorbs the most water?</strong><p><b>C:</b> Change the brand of paper towel.<br><b>O:</b> Measure the amount of water absorbed.<br><b>W:</b> What must stay the same? The size of the towel, starting amount of water and soaking time.<br><b>S:</b> Keep those conditions the same for every brand.</p></div><p><b>Remember:</b> If we change too many things, we cannot tell what caused the result.</p><div class="controls"><span></span><button class="mainbtn" onclick="next()">Next: Check a fair test →</button></div>`:`<div class="small">PART C · SCIENCE SKILLS</div><h1>🔎 How do scientists evaluate a test?</h1><p>Scientists check <b>how</b> an investigation was done and whether its results can be trusted.</p><div class="learn"><h2>Words you'll need</h2><p><b>Method:</b> The steps followed.<br><b>Strength:</b> Something done well.<br><b>Weakness:</b> Something that could affect the results.<br><b>Source of error:</b> Something that may make a measurement inaccurate.<br><b>Improvement:</b> A change that fixes a weakness.<br><b>Evidence:</b> Results or observations supporting a conclusion.</p></div><div class="mini"><strong>Three questions scientists ask</strong><p><b>Was the test fair?</b> Did they keep important conditions the same?<br><b>Can we trust the results?</b> Were measurements accurate and steps followed consistently?<br><b>How could we improve it?</b> What change would make the investigation more reliable?</p></div><p><b>Use COWS to check:</b> What changed? What was measured? What needed to stay the same?</p><div class="controls"><button class="secondary" onclick="back()">← Back</button><button class="mainbtn" onclick="next()">Learn how to compare investigations →</button></div>`;return}
 if(page===-0.75 || page===-0.5 || page===-0.25){

  else {$('card').innerHTML=`<div class="small">PART C · SKILL BUILDER 3 OF 3</div><h1>🕵️ How do we compare two investigations?</h1><p><b>Question:</b> Which brand of paper towel absorbs the most water?</p><div class="cowgrid"><section class="learn"><h2>🔴 Group Red</h2><p>Used <b>equal-sized towel pieces</b>, provided <b>100 mL of water</b> for each test and <b>measured</b> the water absorbed.</p></section><section class="learn"><h2>🔵 Group Blue</h2><p>Used <b>different-sized towel pieces</b>, provided <b>different amounts of water</b> and <b>guessed</b> which towel absorbed most.</p></section></div><div class="learn"><h2>Step 1: Check fair testing</h2><p>Ask: <b>What stayed the same?</b> Red controlled towel size and water amount. Blue changed both, making the comparison less fair.</p></div><div class="learn"><h2>Step 2: Check measuring</h2><p>Ask: <b>How was the result measured?</b> Red measured water absorbed. Blue guessed by looking, so its results are less precise.</p></div><div class="learn"><h2>Step 3: Explain why it matters</h2><p><b>Group ___ had a strength because ___.</b></p><p><b>Group ___ had a weakness because ___. This could affect the results by ___.</b></p></div><button class="secondary" onclick="toggleWorked()" id="revealbtn">👀 Reveal model comparison</button><div id="workedcomparison" class="worked" hidden><p><b>Model:</b> Group Red had a stronger method because it used equal-sized towels, equal amounts of water and measured the water absorbed. Group Blue used different-sized towels and different amounts of water, so its comparison was less fair. Guessing by looking also made its measurements less accurate.</p></div><div class="mini"><b>Check:</b> Have you named what each group did <em>and</em> explained why it matters?</div><div class="controls"><button class="secondary" onclick="back()">← Back</button><button class="mainbtn" onclick="next()">Try Activity 1 →</button></div>`}

  h+=`<div class="learn"><h2>🎯 Choose the best answer for each question</h2><p>No writing needed. Identify whether each choice makes the investigation fairer or the measurements more accurate.</p></div>`;
  questions.forEach((item,idx)=>{
    h+=`<div class="quizpanel"><p class="question">${item.prompt}</p><div class="choices">${item.answers.map((answer,i)=>`<button class="choice ${(chosen[page]||{})[idx]===i?'sel':''}" onclick="selectMulti(${idx},${i})" aria-pressed="${(chosen[page]||{})[idx]===i}">${safe(answer)}</button>`).join('')}</div></div>`;
  });
 }
 if(q.type==='choice')h+=`<div class="choices">${q.options.map((x,i)=>`<button class="choice ${chosen[page]===i?'sel':''}" onclick="selectAnswer(${i})">${safe(x)}</button>`).join('')}</div>`;
 else if(q.type!=='multi'&&q.type!=='claimquiz'){if(page===2)h+=`<section class="learn" style="background:#eef6ff;color:#183451;border:2px solid #9ec6ed"><h2>✏️ Writing help for each question</h2><p><b>1. Conclusion — what pattern do you notice?</b><br>As the water temperature increased, the dissolving time __________.<br>The graph shows that __________.</p><p><b>2. Evidence — which numbers prove it?</b><br>At ___°C, it took ___ seconds, compared with ___ seconds at ___°C.<br>These measurements support my conclusion because __________.</p><p><b>3. Fair testing — why can we compare the results?</b><br>The class needed to keep __________ the same so that __________.<br>If they also changed __________, it would be difficult to know __________.</p><p style="font-size:14px"><b>Remember:</b> A conclusion describes the pattern. Evidence uses numbers from the graph. A fair-testing explanation describes what must stay the same.</p></section>`;h+=`<textarea aria-label="Your answer" placeholder="${safe(q.starter)}" oninput="responses[page]=this.value">${safe(responses[page]||'')}</textarea>`;}
 h+=`<button class="secondary" onclick="hint()">💡 ${hints[page]?'Hide hint':'Need a hint?'}</button>`;
 if(hints[page])h+=`<div class="hint">${safe(q.tip)}</div>`;
 if(results[page])h+=`<div class="feedback ${results[page].ok?'':'warn'}">${results[page].text}</div>`;
 h+=`<div class="controls"><button class="secondary" onclick="back()" >← Back</button><button class="mainbtn" onclick="${results[page]?'next()':'check()'}">${results[page]?'Next activity →':'Check my answer ✓'}</button></div>`;
 $('card').innerHTML=h;
}
function selectMulti(idx,i){if(results[page])return;if(!chosen[page]||typeof chosen[page]!=='object')chosen[page]={};chosen[page][idx]=i;render()}
function selectAnswer(i){if(results[page])return;chosen[page]=i;render()}
function hint(){hints[page]=!hints[page];render()}
function check(){const q=lessons[page];
 if(q.type==='claimquiz'){
   const correct=[1,0,0], ans=chosen[page]||{};
   if(correct.some((v,i)=>ans[i]===undefined)){alert('Choose an answer for all three questions first.');return}
   const score=correct.filter((v,i)=>ans[i]===v).length;
   results[page]={ok:score===3,text:`<b>You got ${score} out of 3 correct.</b><p>${safe(q.model)}</p><p><b>Remember:</b> A strong evaluation makes a judgement, explains why, and identifies evidence.</p>`};render();return;
 }

 if(q.type==='multi'){
   const correct=[0,1,2,0], explanations=page===1?[
     'They measured 100 mL with a measuring cylinder — a measuring strength.',
     'Different-sized filters are a fair-testing weakness.',
     'Using a balance to measure sand mass would improve precision.',
     'Recording dry sand mass before mixing and after recovery would provide useful evidence.'
   ]:[
     'Group Orange strength: They kept the powder mass at 5 g, helping control a variable.',
     'Group Orange weakness: They did not measure the water volume, which could make the comparison unfair.',
     'Group Purple strength: They measured 5 g of powder and 100 mL of water for each trial.',
     'Group Purple weakness: They started timing at different moments, which could affect accuracy.'
   ];
   const answers=chosen[page]||{};
   if(correct.some((_,i)=>answers[i]===undefined)){alert('Choose an answer for all four questions first.');return}
   const score=correct.filter((v,i)=>answers[i]===v).length;
   const details=explanations.map((v,i)=>`<p><b>${answers[i]===correct[i]?'✅':'🔎'} Question ${i+1}:</b> ${safe(v)}</p>`).join('');
   results[page]={ok:score===4,text:`<b>You got ${score} out of 4 correct.</b>${details}<p>Remember: fair testing is about controlling conditions; measuring is about collecting accurate data.</p>`};render();return;
 }
 if(q.type==='choice'&&chosen[page]===undefined){alert('Choose an answer first.');return}
 if(q.type==='write'&&!(responses[page]||'').trim()){alert('Write an answer first.');return}
 let ok=q.type==='write'||chosen[page]===q.correct;
 let msg=q.type==='write'?`📝 <b>Compare your answer with this example:</b><p>${safe(q.model)}</p><small>Written answers are self-checked.</small>`:(ok?'✅ Good thinking! ':'🔎 Check your thinking. ')+safe(q.feedback);
 results[page]={ok,text:msg};render()
}
function next(){page=page===-1?-0.75:page===-0.75?-0.5:page===-0.5?-0.25:page===-0.25?0:page+1;render();window.scrollTo(0,0)}
function back(){if(page>-3){page=page===0?-0.25:page===-0.25?-0.5:page===-0.5?-0.75:page===-0.75?-1:page-1;render();window.scrollTo(0,0)}}
function toggleWorked(){const e=$('workedcomparison');if(e){e.hidden=!e.hidden;$('revealbtn').textContent=e.hidden?'👀 Reveal worked comparison':'Hide worked comparison'}}
function restart(){page=-3;chosen={};responses={};results={};hints={};render()}
document.addEventListener('DOMContentLoaded',render);
</script></body></html>
